version: "3"

tasks:
  spec:install:
    desc: Instala la versión fijada de OpenSpec (requiere Node.js >=20.19.0)
    cmds:
      - npm ci --ignore-scripts

  spec:
    desc: Ejecuta la CLI local de OpenSpec (task spec -- <comando>)
    env:
      OPENSPEC_TELEMETRY: "0"
    preconditions:
      - sh: test -x node_modules/.bin/openspec
        msg: Ejecuta task spec:install para instalar OpenSpec.
    cmds:
      - ./node_modules/.bin/openspec {{.CLI_ARGS}}

  spec:validate:
    desc: Valida todas las specs y cambios con reglas estrictas, sin interacción
    cmds:
      - task: spec
        vars:
          CLI_ARGS: validate --all --strict --no-interactive

  demo:
    desc: Monta todo desde cero (deps, .env, MySQL, migraciones, datos demo y tests)
    cmds:
      - task: install
      - task: env
      - task: db:up
      - task: migrate
      - task: seed
      - task: test
      - |-
        echo ""
        echo "Demo lista. Arranca el servidor con: task dev"
        echo "  Swagger:   http://127.0.0.1:8000/docs"
        echo "  Health:    http://127.0.0.1:8000/health"
        echo "  Health DB: http://127.0.0.1:8000/health/db"

  env:
    desc: Prepara .env (rellena SECRET_KEY/ADMIN_PASSWORD y elige puerto MySQL libre)
    cmds:
      - uv run python scripts/bootstrap_env.py

  install:
    desc: Instala las dependencias del proyecto (uv sync)
    cmds:
      - uv sync

  test:
    desc: Ejecuta la suite de tests (pytest)
    cmds:
      - uv run pytest -v

  lint:
    desc: Comprueba PEP 8 con ruff
    cmds:
      - uv run ruff check .

  fmt:
    desc: Formatea el código con ruff
    cmds:
      - uv run ruff format .

  dev:
    desc: Arranca el servidor con recarga (desarrollo)
    cmds:
      - uv run uvicorn main:app --reload

  start:
    desc: Arranca el servidor sin recarga
    cmds:
      - uv run uvicorn main:app

  db:up:
    desc: Levanta MySQL con docker compose
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Detiene MySQL
    cmds:
      - docker compose down

  migrate:
    desc: Aplica las migraciones pendientes (alembic)
    cmds:
      - uv run alembic upgrade head

  seed:
    desc: Añade datos ficticios de GymFlow sin duplicar ni sobrescribir existentes
    cmds:
      - uv run python -m scripts.seed_gym
