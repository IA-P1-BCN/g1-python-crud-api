version: "3"

tasks:
  demo:
    desc: Monta todo desde cero (deps, .env, MySQL, migraciones y tests)
    cmds:
      - task: install
      - task: env
      - task: db:up
      - task: migrate
      - task: seed
      - task: test
      - |-
        echo ""
        echo "Demo lista. Arranca el servidor con: task dev"
        echo "  Swagger:   http://127.0.0.1:8000/docs"
        echo "  Health:    http://127.0.0.1:8000/health"
        echo "  Health DB: http://127.0.0.1:8000/health/db"

  install:
    desc: Instala las dependencias del proyecto (uv sync)
    cmds:
      - uv sync

  env:
    desc: Prepara .env y una clave JWT aleatoria sin sobrescribir ajustes
    cmds:
      - uv run python -m scripts.ensure_env

  seed:
    desc: Crea usuarios de demostración sin sobrescribir registros existentes
    cmds:
      - uv run python -m scripts.seed_users

  test:
    desc: Ejecuta la suite de tests (pytest)
    cmds:
      - uv run pytest -v

  lint:
    desc: Comprueba PEP 8 con ruff
    cmds:
      - uv run ruff check .

  fmt:
    desc: Formatea el código con ruff
    cmds:
      - uv run ruff format .

  dev:
    desc: Arranca el servidor con recarga (desarrollo)
    cmds:
      - uv run uvicorn main:app --reload

  start:
    desc: Arranca el servidor sin recarga
    cmds:
      - uv run uvicorn main:app

  db:up:
    desc: Levanta MySQL con docker compose
    cmds:
      - docker compose up -d --wait

  db:down:
    desc: Detiene MySQL
    cmds:
      - docker compose down

  migrate:
    desc: Aplica las migraciones pendientes (alembic)
    cmds:
      - uv run alembic upgrade head
