version: "3"

tasks:
  spec:install:
    desc: Instala la versión fijada de OpenSpec (requiere Node.js >=20.19.0)
    cmds:
      - npm ci --ignore-scripts

  spec:
    desc: Ejecuta la CLI local de OpenSpec (task spec -- <comando>)
    env:
      OPENSPEC_TELEMETRY: "0"
    preconditions:
      - sh: test -x node_modules/.bin/openspec
        msg: Ejecuta task spec:install para instalar OpenSpec.
    cmds:
      - ./node_modules/.bin/openspec {{.CLI_ARGS}}

  spec:validate:
    desc: Valida todas las specs y cambios con reglas estrictas, sin interacción
    cmds:
      - task: spec
        vars:
          CLI_ARGS: validate --all --strict --no-interactive

  demo:
    desc: Monta todo desde cero (deps, .env, MySQL, migraciones, datos demo y tests)
    cmds:
      - task: install
      - task: env
      - task: db:up
      - task: migrate
      - task: seed
      - task: test
      - |-
        echo ""
        echo "Demo lista. Arranca el servidor con: task dev"
        echo "  Swagger:   http://127.0.0.1:8000/docs"
        echo "  Health:    http://127.0.0.1:8000/health"
        echo "  Health DB: http://127.0.0.1:8000/health/db"

  env:
    desc: Prepara .env (rellena SECRET_KEY/ADMIN_PASSWORD y elige puerto MySQL libre)
    cmds:
      - uv run python scripts/bootstrap_env.py

  install:
    desc: Instala las dependencias del proyecto (uv sync)
    cmds:
      - uv sync

  test:
    desc: Ejecuta la suite de tests (pytest)
    cmds:
      - uv run pytest -v

  lint:
    desc: Comprueba PEP 8 con ruff
    cmds:
      - uv run ruff check .

  fmt:
    desc: Formatea el código con ruff
    cmds:
      - uv run ruff format .

  dev:
    desc: Arranca el servidor con recarga (desarrollo)
    cmds:
      - uv run uvicorn main:app --reload

  start:
    desc: Arranca el servidor sin recarga
    cmds:
      - uv run uvicorn main:app

  frontend:install:
    desc: Instala dependencias de Angular si aún no están
    dir: frontend
    status:
      - test -d node_modules
    cmds:
      - npm ci

  frontend:
    desc: Arranca Angular en http://127.0.0.1:4200
    dir: frontend
    cmds:
      - npm start

  serve:
    desc: Arranca la API y el frontend en paralelo
    deps: [dev, frontend]

  up:
    desc: Inicializa el entorno y arranca MySQL, API y frontend
    cmds:
      - task: install
      - task: env
      - task: frontend:install
      - task: db:up
      - task: migrate
      - task: seed
      - |-
        echo ""
        echo "GymFlow listo."
        echo "  API:      http://127.0.0.1:8000/docs"
        echo "  Frontend: http://127.0.0.1:4200"
        echo "  Ctrl+C detiene API y frontend."
      - task: serve

  db:up:
    desc: Levanta solo MySQL con docker compose
    cmds:
      - docker compose up -d --wait mysql

  db:down:
    desc: Detiene los servicios de Compose
    cmds:
      - docker compose down

  compose:
    desc: Levanta MySQL, API y frontend en Docker
    cmds:
      - docker compose up -d --build --wait

  docker:up:
    desc: Inicializa .env y arranca MySQL, API, frontend y datos demo en Docker
    cmds:
      - task: env
      - task: compose
      - docker compose exec -T api python -m scripts.seed_gym
      - |-
        echo ""
        echo "GymFlow en Docker."
        echo "  API:      http://127.0.0.1:8000/docs"
        echo "  Frontend: http://127.0.0.1:4200"
        echo "  task db:down detiene los contenedores."

  migrate:
    desc: Aplica las migraciones pendientes (alembic)
    cmds:
      - uv run alembic upgrade head

  seed:
    desc: Añade datos ficticios de GymFlow sin duplicar ni sobrescribir existentes
    cmds:
      - uv run python -m scripts.seed_gym
